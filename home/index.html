<style>

  *{ box-sizing:border-box; }

  .wrap{ width:100%; max-width:940px; }

  .searchpanel{ max-width:820px; margin:0 auto 10px; display:flex; gap:16px 28px; flex-wrap:wrap; align-items:center; justify-content:center; }
  .field{ display:flex; align-items:center; gap:10px; }
  .field label{ font-weight:600; font-size:14px; white-space:nowrap; }
  #role{ background:var(--board); border:1px solid var(--line); color:var(--ink); font-size:15px; padding:11px 14px; border-radius:8px; width:280px; outline:none; }
  .field select{ background:var(--board); border:1px solid var(--line); color:var(--ink); font-size:14px; padding:11px 12px; border-radius:8px; outline:none; cursor:pointer; }
  .go{ background:var(--teal); color:#062420; border:none; font-weight:700; font-size:15px; padding:12px 24px; border-radius:8px; cursor:pointer; }
  .hint{ width:100%; text-align:center; font-size:13px; color:var(--teal); margin:14px 0 0; opacity:.85; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; white-space:nowrap; border:0; }

  .skip-link:focus{ top:8px; }

  .pill-google{ color:var(--amber); border-color:var(--amber); background:rgba(255,176,32,0.08); }
  .pill-portal{ color:var(--purple); border-color:var(--purple); background:rgba(167,139,250,0.08); }

  .star-btn.active{ color:var(--amber); }

  .row.pinned .pname{ color:var(--amber); }
  .groupbar.favorites-bar{ color:var(--amber); }
