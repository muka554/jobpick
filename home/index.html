<!DOCTYPE html>
<!-- Existing homepage content preserved; authentication controls added. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gulf Job Hub — Search Every Board at Once</title>
<style>
  #userGreeting, #logoutBtn { display: none; }
  #userGreeting.is-visible, #logoutBtn.is-visible { display: inline-block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<span id="userGreeting" hidden></span>
<button id="logoutBtn" type="button" hidden>Log out</button>
<script>
(function () {
  'use strict';

  const SUPABASE_URL = 'https://rvitqbkgtgjharxqaxmv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_aUYK7r0Nrm8y7AXYEFkR5Q_z0lTWUtt';

  if (!window.supabase) return;

  window.gulfSupabaseClient = window.gulfSupabaseClient ||
    window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const greeting = document.getElementById('userGreeting');
  const logout = document.getElementById('logoutBtn');
  if (!greeting || !logout) return;

  async function renderUser(session) {
    const user = session && session.user;
    if (!user) {
      greeting.hidden = true;
      logout.hidden = true;
      greeting.classList.remove('is-visible');
      logout.classList.remove('is-visible');
      return;
    }

    const metadata = user.user_metadata || {};
    const name = metadata.full_name || metadata.name || user.email || 'Account';
    greeting.textContent = `Hi, ${name}`;
    greeting.hidden = false;
    logout.hidden = false;
    greeting.classList.add('is-visible');
    logout.classList.add('is-visible');
  }

  window.gulfSupabaseClient.auth.getSession()
    .then(({ data }) => renderUser(data.session))
    .catch(() => renderUser(null));

  window.gulfSupabaseClient.auth.onAuthStateChange((_event, session) => {
    renderUser(session);
  });

  logout.addEventListener('click', async () => {
    logout.disabled = true;
    const { error } = await window.gulfSupabaseClient.auth.signOut();
    if (error) {
      logout.disabled = false;
      return;
    }
    window.location.href = '/account/';
  });
})();
</script>
</body>
</html>
