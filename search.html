<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Jobs | Job Pick</title>
<meta name="description" content="Search employment resources and job platforms for opportunities in the UAE and Saudi Arabia.">
<link rel="canonical" href="https://jobpick20.com/search.html">
<style>body{margin:0;background:#f7fbfc;color:#111;font-family:Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:30px 20px}header{background:#acd1dc;padding:22px;text-align:center;font:34px Georgia,serif}h1{font:42px Georgia,serif;margin-bottom:10px}.card{background:#fff;border:1px solid #d8e6e9;border-radius:12px;padding:24px;box-shadow:0 8px 30px #1231;margin-top:25px}form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}input,select,button{min-height:44px;padding:0 12px;font:inherit;border:1px solid #aac5cb;border-radius:6px}button{background:#acd1dc;font-weight:700;cursor:pointer}.links{display:grid;gap:10px;margin-top:22px}.links a{display:block;padding:14px;border:1px solid #d8e6e9;color:#245763;text-decoration:none;border-radius:6px}.links a:hover{background:#eef8fa}@media(max-width:700px){form{grid-template-columns:1fr}.wrap{padding:22px 15px}}</style>
</head>
<body><header>Job Pick</header><main class="wrap"><p><a href="index.html">← Back to home</a></p><h1>Find Jobs</h1><p>Search trusted job platforms and employment resources for the UAE and Saudi Arabia.</p><section class="card"><form id="form"><input id="role" placeholder="Role or keyword e.g. technical support" required><select id="country"><option>United Arab Emirates</option><option>Saudi Arabia</option></select><input id="city" placeholder="City (optional)"><button>Search</button></form><div id="links" class="links" aria-live="polite"></div></section></main><script>const links=document.getElementById('links');document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const q=encodeURIComponent(document.getElementById('role').value.trim()),c=encodeURIComponent(document.getElementById('city').value.trim()||document.getElementById('country').value);links.innerHTML=[['LinkedIn',`https://www.linkedin.com/jobs/search/?keywords=${q}&location=${c}`],['Indeed',`https://www.indeed.com/jobs?q=${q}&l=${c}`],['Google job search',`https://www.google.com/search?q=${q}+jobs+${c}`],['Bayt',`https://www.google.com/search?q=site%3Abayt.com+${q}+${c}`],['GulfTalent',`https://www.google.com/search?q=site%3Agulftalent.com+${q}+${c}`]].map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${n} — Open search ↗</a>`).join('')});</script></body></html>
