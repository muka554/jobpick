name: Site regression checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: HTML, JavaScript, and JSON checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic site regression checks
        run: node tests/site-regression.mjs

      - name: Verify CV PDF templates
        run: node tests/cv-pdf-export.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets scripts -type f -name '*.js' -print0 2>/dev/null)

      - name: Validate JSON assets
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)

      - name: Check whitespace errors
        run: git diff --check
