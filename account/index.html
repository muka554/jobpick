<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --bg:#0A0F14; --panel:#101820; --board:#0D131A; --amber:#FFB020; --teal:#2DD9C0; --purple:#A78BFA; --ink:#ECE8DE; --ink-dim:#8B93A3; --line:#222B36; --red:#E2574C; }
  *{ box-sizing:border-box; }
  body{ -webkit-user-select:none; user-select:none; }
  input{ user-select:text; }
  html,body{ margin:0; padding:0; background:var(--bg); }
  body{ font-family:'Inter',sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; justify-content:center; padding:28px 14px 60px; }
  .wrap{ width:100%; max-width:440px; }
  a{ color:var(--amber); }
  a:focus-visible, button:focus-visible, input:focus-visible{ outline:3px solid var(--amber); outline-offset:2px; }
  .sitenav{ display:flex; justify-content:center; margin-bottom:32px; padding-bottom:14px; }
  .sitenav .brand{ font-family:'Manrope',sans-serif; font-weight:800; font-size:19px; color:var(--teal); text-decoration:none; }
  .eyebrow{ font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.18em; font-size:12px; color:var(--amber); font-weight:600; text-align:center; display:block; }
  h1{ font-family:'Manrope',sans-serif; font-weight:800; font-size:30px; margin:10px 0 24px; line-height:1.1; text-align:center; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:28px; }
  .tabs{ display:flex; gap:6px; background:var(--board); border-radius:8px; padding:4px; margin-bottom:22px; }
  .tab-btn{ flex:1; background:transparent; border:none; color:var(--ink-dim); font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:13px; font-weight:600; padding:9px; border-radius:6px; cursor:pointer; }
  .tab-btn.active{ background:var(--teal); color:#062420; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label{ font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.1em; font-size:11.5px; color:var(--ink-dim); }
  .field input{ background:var(--board); border:1px solid var(--line); color:var(--ink); font-family:'Inter',sans-serif; font-size:14.5px; padding:11px 12px; border-radius:4px; outline:none; }
  .field input:focus{ border-color:var(--teal); }
  .submit-btn{ width:100%; background:var(--teal); color:#062420; border:none; font-weight:700; font-family:'Inter',sans-serif; font-size:15px; padding:13px 24px; border-radius:8px; cursor:pointer; margin-top:6px; }
  .submit-btn:hover{ background:#3EF2D6; box-shadow:0 4px 12px rgba(45,217,192,0.35); }
  .submit-btn:disabled{ opacity:.6; cursor:not-allowed; }
  .divider{ display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--ink-dim); font-size:12.5px; }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--line); }
  .google-btn{ width:100%; display:flex; align-items:center; justify-content:center; gap:10px; background:var(--board); border:1px solid var(--line); color:var(--ink); font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px; padding:12px 24px; border-radius:8px; cursor:pointer; }
  .google-btn:hover{ border-color:var(--amber); }
  .google-btn svg{ width:18px; height:18px; }
  .msg{ font-size:13.5px; margin-top:16px; padding:10px 14px; border-radius:6px; display:none; }
  .msg.error{ background:rgba(226,87,76,0.1); border:1px solid var(--red); color:var(--red); display:block; }
  .msg.success{ background:rgba(45,217,192,0.1); border:1px solid var(--teal); color:var(--teal); display:block; }
  .switch-note{ text-align:center; font-size:13px; color:var(--ink-dim); margin-top:18px; }
  .switch-note a{ color:var(--amber); text-decoration:none; font-weight:600; cursor:pointer; }
  .hidden{ display:none !important; }
  footer{ margin-top:32px; font-size:12px; color:var(--ink-dim); text-align:center; }
  footer a{ color:var(--ink-dim); }
</style>

  body[data-page="account"]{
    background:
      radial-gradient(circle at 15% 20%, rgba(45,217,192,0.09), transparent 45%),

<body data-page="account">
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N64BK74G" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div class="wrap">
  <nav class="sitenav" aria-label="Site">
    <a class="brand" href="/">GULF JOB HUB</a>
  </nav>

  <span class="eyebrow">Your account</span>
  <h1 id="pageTitle">Sign in</h1>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="tabSignIn" type="button">Sign In</button>
      <button class="tab-btn" id="tabSignUp" type="button">Sign Up</button>
    </div>

    <button class="google-btn" id="googleBtn" type="button">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.4 0 10.3-1.8 14-5.5l-6.4-5.4c-2 1.4-4.6 2.3-7.6 2.3-5.3 0-9.7-3.4-11.3-8l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.4 5.4C39.5 37.4 44 31.4 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <form id="authForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="6">
      </div>
      <button class="submit-btn" id="submitBtn" type="submit">Sign In</button>
    </form>

    <div class="msg" id="msgBox"></div>
  </div>

  <p class="switch-note" id="switchNote">Don't have an account? <a id="switchLink">Sign up</a></p>

  <footer>
    <a href="/privacy-policy/">Privacy Policy</a> · <a href="/terms-of-use/">Terms of Use</a>
  </footer>
</div>

<script>
const SUPABASE_URL = 'https://rvitqbkgtgjharxqaxmv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2aXRxYmtndGdqaGFyeHFheG12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MzI3NDksImV4cCI6MjEwMzAwODc0OX0.ZFymY7cookYUUMUAMfVsKHgzgH8l4FYecyn_AgW8FJc';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let mode = 'signin';

const tabSignIn = document.getElementById('tabSignIn');
const tabSignUp = document.getElementById('tabSignUp');
const pageTitle = document.getElementById('pageTitle');
const submitBtn = document.getElementById('submitBtn');
const switchNote = document.getElementById('switchNote');
const switchLink = document.getElementById('switchLink');
const msgBox = document.getElementById('msgBox');
const passwordInput = document.getElementById('password');

function setMode(newMode){
  mode = newMode;
  const isSignUp = mode === 'signup';
  tabSignIn.classList.toggle('active', !isSignUp);
  tabSignUp.classList.toggle('active', isSignUp);
  pageTitle.textContent = isSignUp ? 'Create your account' : 'Sign in';
  submitBtn.textContent = isSignUp ? 'Create Account' : 'Sign In';
  passwordInput.setAttribute('autocomplete', isSignUp ? 'new-password' : 'current-password');
  switchNote.innerHTML = isSignUp
    ? 'Already have an account? <a id="switchLink">Sign in</a>'
    : "Don't have an account? <a id=\"switchLink\">Sign up</a>";
  document.getElementById('switchLink').addEventListener('click', () => setMode(isSignUp ? 'signin' : 'signup'));
  msgBox.className = 'msg';
  msgBox.textContent = '';
}

tabSignIn.addEventListener('click', () => setMode('signin'));
tabSignUp.addEventListener('click', () => setMode('signup'));
switchLink.addEventListener('click', () => setMode('signup'));

document.getElementById('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = passwordInput.value;
  submitBtn.disabled = true;
  msgBox.className = 'msg';

  try{
    if(mode === 'signup'){
      const { error } = await supabaseClient.auth.signUp({ email, password });
      if(error) throw error;
      msgBox.className = 'msg success';
      msgBox.textContent = 'Account created! Check your email to confirm, then sign in.';
    } else {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error) throw error;
      window.location.href = '/';
    }
  } catch(err){
    msgBox.className = 'msg error';
    msgBox.textContent = err.message || 'Something went wrong. Please try again.';
  } finally {
    submitBtn.disabled = false;
  }
});

document.getElementById('googleBtn').addEventListener('click', async () => {
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/' }
  });
  if(error){
    msgBox.className = 'msg error';
    msgBox.textContent = error.message;
  }
});

(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session){ window.location.href = '/'; }
})();
</script>
</body>
</html>
