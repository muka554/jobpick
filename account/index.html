<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Gulf Job Hub</title>
<meta name="description" content="Log in to use Gulf Job Hub.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/auth-nav.js"></script>
<style>
:root{--bg:#0A0F14;--panel:#101820;--board:#0D131A;--amber:#FFB020;--teal:#2DD9C0;--ink:#ECE8DE;--dim:#8B93A3;--line:#222B36}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,Arial,sans-serif;color:var(--ink);padding:28px 14px}.wrap{max-width:560px;margin:auto}.brand{display:inline-block;color:var(--teal);font-weight:800;font-size:19px;text-decoration:none;margin-bottom:36px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px}h1{margin:0 0 10px;font-size:34px}p{color:var(--dim);line-height:1.6}.field{display:flex;flex-direction:column;gap:7px;margin:18px 0}.field label{font-size:13px;color:var(--dim)}input{background:var(--board);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--ink);font-size:15px;width:100%}.button{border:0;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}.primary{background:var(--teal);color:#062420}.secondary{background:transparent;border:1px solid var(--amber);color:var(--amber)}.google{background:#fff;color:#1f1f1f;display:flex;align-items:center;justify-content:center;gap:10px}.google svg{width:18px;height:18px}.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--dim);font-size:12px}.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}.skip{background:transparent;border:none;color:var(--dim);text-decoration:underline;cursor:pointer;font-size:13px;padding:10px 0 0;width:100%}#message{min-height:22px;color:var(--amber);font-size:13px}.small{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap"><a class="brand" href="/">GULF JOB HUB</a><section class="panel"><h1>Sign in to continue</h1><p>Log in to access Gulf Job Hub and continue to the page you requested.</p><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="button primary" type="submit">Log in</button><button class="button secondary" id="signupBtn" type="button">Create account</button></form><div class="divider">or</div><button class="button google" id="googleBtn" type="button"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8 3l6-6C34.5 5.5 29.5 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.3-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13.5 24 13.5c3.1 0 5.9 1.1 8 3l6-6C34.5 6.5 29.5 4.5 24 4.5c-7.6 0-14.1 4.3-17.7 10.6z"/><path fill="#4CAF50" d="M24 44.5c5.4 0 10.3-1.9 14-5.1l-6.5-5.4c-2 1.4-4.6 2.2-7.5 2.2-5.2 0-9.6-3.1-11.3-7.5l-6.6 5.1C9.8 39.9 16.4 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.9 2.6-2.6 4.8-4.8 6.3l6.5 5.4C40.9 36.4 44.5 30.9 44.5 24c0-1.2-.1-2.4-.3-3.5z"/></svg>Continue with Google</button><button class="skip" id="skipBtn" type="button">Skip for now</button><p id="message" role="status"></p><p class="small">You will return to your original page after successful login.</p></section></div>
<script>
const client=window.gulfSupabaseClient;const message=document.getElementById('message');const next=window.gulfSafeNext(new URLSearchParams(window.location.search).get('next'));
client.auth.getUser().then(({data})=>{if(data?.user) window.location.replace(next)});
document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();message.textContent='Signing in…';const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){message.textContent=error.message;return}window.location.replace(next)});
document.getElementById('signupBtn').addEventListener('click',async()=>{message.textContent='Creating account…';const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;if(!email||!password){message.textContent='Enter an email and password first.';return}const {data,error}=await client.auth.signUp({email,password,emailRedirectTo:`${window.location.origin}/account/?next=${encodeURIComponent(next)}`});message.textContent=error?error.message:(data.session?'Account created. Redirecting…':'Account created. Check your email to confirm, then log in.');if(data.session) window.location.replace(next)});
document.getElementById('googleBtn').addEventListener('click',async()=>{message.textContent='Redirecting to Google…';const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:`${window.location.origin}/account/?next=${encodeURIComponent(next)}`}});if(error){message.textContent=error.message}});
document.getElementById('skipBtn').addEventListener('click',()=>{window.location.replace('/')});
</script>
</body>
</html>
