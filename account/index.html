<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Gulf Job Hub</title>
<meta name="description" content="Log in to use Gulf Job Hub.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/auth-nav.js"></script>
<style>
:root{--bg:#0A0F14;--panel:#101820;--board:#0D131A;--amber:#FFB020;--teal:#2DD9C0;--ink:#ECE8DE;--dim:#8B93A3;--line:#222B36}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Inter,Arial,sans-serif;color:var(--ink);padding:28px 14px}.wrap{max-width:560px;margin:auto}.brand{display:inline-block;color:var(--teal);font-weight:800;font-size:19px;text-decoration:none;margin-bottom:36px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px}h1{margin:0 0 10px;font-size:34px}p{color:var(--dim);line-height:1.6}.field{display:flex;flex-direction:column;gap:7px;margin:18px 0}.field label{font-size:13px;color:var(--dim)}input{background:var(--board);border:1px solid var(--line);border-radius:8px;padding:12px;color:var(--ink);font-size:15px;width:100%}.button{border:0;border-radius:8px;padding:12px 16px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}.primary{background:var(--teal);color:#062420}.secondary{background:transparent;border:1px solid var(--amber);color:var(--amber)}#message{min-height:22px;color:var(--amber);font-size:13px}.small{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap"><a class="brand" href="/">GULF JOB HUB</a><section class="panel"><h1>Sign in to continue</h1><p>Log in to access Gulf Job Hub and continue to the page you requested.</p><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="button primary" type="submit">Log in</button><button class="button secondary" id="signupBtn" type="button">Create account</button></form><p id="message" role="status"></p><p class="small">You will return to your original page after successful login.</p></section></div>
<script>
const client=window.gulfSupabaseClient;const message=document.getElementById('message');const next=window.gulfSafeNext(new URLSearchParams(window.location.search).get('next'));
client.auth.getUser().then(({data})=>{if(data?.user) window.location.replace(next)});
document.getElementById('loginForm').addEventListener('submit',async event=>{event.preventDefault();message.textContent='Signing in…';const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){message.textContent=error.message;return}window.location.replace(next)});
document.getElementById('signupBtn').addEventListener('click',async()=>{message.textContent='Creating account…';const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;if(!email||!password){message.textContent='Enter an email and password first.';return}const {data,error}=await client.auth.signUp({email,password,emailRedirectTo:`${window.location.origin}/account/?next=${encodeURIComponent(next)}`});message.textContent=error?error.message:(data.session?'Account created. Redirecting…':'Account created. Check your email to confirm, then log in.');if(data.session) window.location.replace(next)});
</script>
</body>
</html>
